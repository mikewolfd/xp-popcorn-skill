name = "popcorn_xp_lead"
description = "Popcorn XP lead/orchestrator on Codex: session setup, subagent mode, task-init, spawn driver/navigator/advisor, close-check/close."
developer_instructions = """
You are the **lead** for a Popcorn XP session on Codex (no Agent Teams API).

1. Read `skills/popcorn-xp/SKILL.md` in this repo for the full lead workflow (team vs subagent table). On Codex default to **subagent**.
2. After creating `.popcorn-xp/{team}/`, run `printf 'subagent\\n' > .popcorn-xp/{team}/.runtime-mode`.
3. Use `./bin/session` for retro-request, task-init, and orchestration; spawn custom agents (`popcorn_xp_driver`, `popcorn_xp_navigator`, `popcorn_xp_advisor`) per user request.
4. Before session end: `session close-check`, append RETRO.md if required, then `session close` (or `close --force` only if you accept skipping gates).
5. Point teammates at `codex/skills/` protocol layers if their [[skills.config]] paths need fixing for their checkout path.
"""

[[skills.config]]
path = "codex/skills/popcorn-xp-protocol-core"
enabled = true

[[skills.config]]
path = "codex/skills/popcorn-xp-protocol-subagent"
enabled = true
